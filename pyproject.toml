[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aither-kvcache"
version = "2.4.0"
description = "KV cache tooling for LLM inference — TurboQuant (vector quantization), TriAttention (spectral compression), and cross-model KV transfer (skip prefill by converting one model's cache into another's)"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
authors = [
    { name = "Aitherium" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "kv-cache", "quantization", "llm", "inference", "compression",
    "turboquant", "triattention", "spectral", "vllm", "attention",
    "kv-transfer", "cross-model", "prefill", "rope", "mla",
]
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
triton = ["triton>=2.0"]
scipy = ["scipy"]
dev = ["pytest"]
vllm = ["vllm>=0.15"]
# Cross-model KV transfer: the mapper, pack format and rotation math need only
# numpy (already a core dep). Capturing activations from real models and the
# acceptance evaluation additionally need transformers; both are imported
# lazily so the rest of the package works without them.
transfer = ["transformers>=4.40"]
all = ["triton>=2.0", "scipy", "pytest", "transformers>=4.40"]

[project.entry-points."vllm.general_plugins"]
aither_kvcache = "aither_kvcache.vllm.plugin:register"

[project.urls]
Paper = "https://arxiv.org/abs/2504.19874"
Repository = "https://github.com/Aitherium/aitherkvcache"
Changelog = "https://github.com/Aitherium/aitherkvcache/releases"

[tool.setuptools.packages.find]
include = ["aither_kvcache*", "turboquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
